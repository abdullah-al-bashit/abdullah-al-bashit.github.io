name: Build and deploy site

# Rebuilds the HTML pages from the JSON content files and publishes the site.
# Runs on every push to main, so editing a JSON file on github.com is enough.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build HTML from JSON
        run: |
          for script in build_*.py; do
            python3 -B "$script"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
